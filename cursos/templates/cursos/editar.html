{% extends 'cursos/base.html' %}

{% block titulo %}Editar curso - Academia Online{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-warning">
                <h4 class="mb-0">Editar curso: {{ curso.nombre }}</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for campo in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                            {{ campo }}
                            {% for error in campo.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-warning">Guardar cambios</button>
                    <a href="{% url 'lista_cursos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
